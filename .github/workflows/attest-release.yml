name: Attest mc-cli release
# GitHub artifact attestations for the public archives (the private mission-control repo cannot store them).
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --dir dist
          test -s dist/SHA256SUMS
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/SHA256SUMS
