name: Homebrew Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install formula
        # Use an absolute path: setup-homebrew may leave the shell outside the checkout.
        run: brew install --formula "${{ github.workspace }}/Formula/mc-cli.rb"
      - name: Test formula
        run: brew test mc-cli
