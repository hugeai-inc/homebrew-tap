name: Homebrew Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # setup-homebrew checks out this tap into Homebrew's tap path, so a
      # separate actions/checkout is unnecessary and a local .rb path install
      # is ignored in favor of the formula name.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install formula
        run: brew install hugeai-inc/tap/mc-cli
      - name: Test formula
        run: brew test hugeai-inc/tap/mc-cli
      - name: Check version
        run: mc version --plain
